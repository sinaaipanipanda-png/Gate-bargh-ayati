<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه قطعی برق | تهران بزرگ</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042); color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; position: relative; }
        header { text-align: center; margin-top: 20px; margin-bottom: 30px; }
        header h1 { font-size: 1.8rem; margin-bottom: 8px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        header p { font-size: 0.95rem; color: #cbd5e1; background: rgba(255, 255, 255, 0.1); padding: 6px 16px; border-radius: 20px; display: inline-block; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
        .glass { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); padding: 24px; }
        .card-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .card-row:last-child { border-bottom: none; }
        .card-label { color: #94a3b8; font-size: 0.95rem; }
        .card-value { font-weight: 600; font-size: 1rem; color: #f8fafc; }
        .empty-state { text-align: center; padding: 40px 20px; color: #cbd5e1; font-size: 1.1rem; }
        .admin-star-btn { position: fixed; bottom: 25px; right: 25px; width: 55px; height: 55px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.25); color: #fbbf24; font-size: 1.8rem; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 90; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        .modal-content { width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #cbd5e1; }
        .form-group input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0, 0, 0, 0.3); color: #fff; outline: none; }
        .btn-submit { width: 100%; padding: 12px; border: none; border-radius: 10px; background: linear-gradient(90deg, #6366f1, #a855f7); color: white; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-cancel-edit { background: rgba(255,255,255,0.1); color: #cbd5e1; padding: 8px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; width: 100%; margin-top: 5px; cursor: pointer; }
        .btn-close { background: transparent; border: none; color: #fca5a5; cursor: pointer; font-size: 0.9rem; }
        .admin-list { margin-top: 25px; border-top: 1px solid rgba(255, 255, 255, 0.15); padding-top: 15px; }
        .admin-item { background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .admin-item-info { font-size: 0.85rem; }
        .admin-item-title { font-weight: bold; color: #fbbf24; margin-bottom: 2px; }
        .action-btns { display: flex; gap: 8px; }
        .btn-edit { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .btn-delete { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1>سامانه اعلام قطعی برق</h1>
        <p>شناسه قبض: ۹۴۱۲۴۴۶۸۰۴۱۲۹ | تهران بزرگ</p>
    </header>

    <div class="container" id="cards-container"></div>

    <button type="button" class="admin-star-btn" onclick="openPassModal()">★</button>

    <div class="modal" id="passModal">
        <div class="glass modal-content" style="max-width: 380px;">
            <div class="modal-header"><h2>ورود مدیر</h2></div>
            <div class="form-group">
                <label>رمز عبور:</label>
                <input type="password" id="adminPassInput" placeholder="****">
            </div>
            <button type="button" class="btn-submit" onclick="checkPassword()">ورود به پنل</button>
            <button type="button" class="btn-close" style="width: 100%; margin-top: 10px;" onclick="closePassModal()">انصراف</button>
        </div>
    </div>

    <div class="modal" id="adminPanelModal">
        <div class="glass modal-content">
            <div class="modal-header">
                <h2>⚙️ پنل مدیریت اعلام قطعی</h2>
                <button type="button" class="btn-close" onclick="closeAdminPanel()">خروج ✕</button>
            </div>
            <form id="outageForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editingId" value="">
                <h3 id="formTitle" style="font-size: 1rem; margin-bottom: 10px; color: #a7f3d0;">ثبت قطعی برق جدید</h3>
                <div class="form-group"><label>تاریخ قطعی</label><input type="text" id="outageDate" placeholder="مثال: ۱۴۰۳/۰۵/۱۲" required></div>
                <div class="form-group"><label>ساعت قطعی</label><input type="text" id="outageTime" placeholder="مثال: ۱۴:۰۰" required></div>
                <div class="form-group"><label>ساعت وصل شدن</label><input type="text" id="restoreTime" placeholder="مثال: ۱۶:۳۰" required></div>
                <div class="form-group"><label>علت قطعی برق</label><input type="text" id="reason" placeholder="مثال: مانور عملیاتی شبکه" required></div>
                <button type="submit" id="submitBtn" class="btn-submit">افزودن کارت</button>
                <button type="button" id="cancelEditBtn" class="btn-cancel-edit" style="display: none;" onclick="resetForm()">انصراف از ویرایش</button>
            </form>
            <div class="admin-list">
                <h3 style="font-size: 1rem; margin-bottom: 12px; color: #cbd5e1;">لیست قطعی‌های ثبت شده:</h3>
                <div id="adminItemsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // آدرس پایگاه داده ابری عمومی و رایگان
        const API_URL = 'https://api.jsonbin.io/v3/b/66abb2bde41b4d34e41712a8';
        const API_KEY = '$2a$10$wKkS1J5eFv0vM4N8lS9lve9fL0R1qE1v0b0c0d0e0f0g0h0i0j';

        let currentAdminPassword = null;
        let allOutages = [];

        async function fetchOutages() {
            try {
                const res = await fetch(API_URL + '/latest');
                const data = await res.json();
                allOutages = data.record || [];
                renderMainCards(allOutages);
                renderAdminList(allOutages);
            } catch (err) {
                const localData = JSON.parse(localStorage.getItem('outagesData')) || [];
                allOutages = localData;
                renderMainCards(allOutages);
                renderAdminList(allOutages);
            }
        }

        async function saveToCloud(data) {
            localStorage.setItem('outagesData', JSON.stringify(data));
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(data)
                });
            } catch (err) { console.error(err); }
        }

        function renderMainCards(data) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            if (!data || data.length === 0) {
                container.innerHTML = `<div class="glass empty-state">در حال حاضر هیچ برنامه قطعی برقی ثبت نشده است.</div>`;
                return;
            }
            data.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'glass';
                card.innerHTML = `
                    <div class="card-row"><span class="card-label">تاریخ قطعی:</span><span class="card-value">${item.date}</span></div>
                    <div class="card-row"><span class="card-label">ساعت قطعی:</span><span class="card-value">${item.outageTime}</span></div>
                    <div class="card-row"><span class="card-label">ساعت وصل شدن:</span><span class="card-value">${item.restoreTime}</span></div>
                    <div class="card-row"><span class="card-label">علت قطعی برق:</span><span class="card-value">${item.reason}</span></div>
                `;
                container.appendChild(card);
            });
        }

        function renderAdminList(data) {
            const container = document.getElementById('adminItemsContainer');
            container.innerHTML = '';
            if (!data || data.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: #94a3b8; font-size: 0.85rem;">هیچ قطعی ثبت نشده است.</div>`;
                return;
            }
            data.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'admin-item';
                div.innerHTML = `
                    <div class="admin-item-info">
                        <div class="admin-item-title">تاریخ: ${item.date} (${item.outageTime} تا ${item.restoreTime})</div>
                        <div style="color: #cbd5e1;">علت: ${item.reason}</div>
                    </div>
                    <div class="action-btns">
                        <button type="button" class="btn-edit" onclick="startEdit(${item.id})">ویرایش</button>
                        <button type="button" class="btn-delete" onclick="deleteCard(${item.id})">حذف</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function openPassModal() {
            document.getElementById('adminPassInput').value = '';
            document.getElementById('passModal').style.display = 'flex';
        }

        function closePassModal() {
            document.getElementById('passModal').style.display = 'none';
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === "9412") {
                currentAdminPassword = pass;
                closePassModal();
                document.getElementById('adminPanelModal').style.display = 'flex';
                fetchOutages();
            } else {
                alert("رمز عبور اشتباه است!");
            }
        }

        function closeAdminPanel() {
            document.getElementById('adminPanelModal').style.display = 'none';
            resetForm();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const editingId = document.getElementById('editingId').value;
            const newItem = {
                id: editingId ? parseInt(editingId) : Date.now(),
                date: document.getElementById('outageDate').value,
                outageTime: document.getElementById('outageTime').value,
                restoreTime: document.getElementById('restoreTime').value,
                reason: document.getElementById('reason').value
            };

            if (editingId) {
                const index = allOutages.findIndex(o => o.id === parseInt(editingId));
                if (index !== -1) allOutages[index] = newItem;
            } else {
                allOutages.push(newItem);
            }

            await saveToCloud(allOutages);
            resetForm();
            fetchOutages();
        }

        function startEdit(id) {
            const item = allOutages.find(o => o.id === id);
            if (!item) return;
            document.getElementById('editingId').value = item.id;
            document.getElementById('outageDate').value = item.date;
            document.getElementById('outageTime').value = item.outageTime;
            document.getElementById('restoreTime').value = item.restoreTime;
            document.getElementById('reason').value = item.reason;
            document.getElementById('formTitle').innerText = '✏️ ویرایش اطلاعات قطعی';
            document.getElementById('formTitle').style.color = '#93c5fd';
            document.getElementById('submitBtn').innerText = 'ذخیره تغییرات';
            document.getElementById('cancelEditBtn').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('editingId').value = '';
            document.getElementById('outageForm').reset();
            document.getElementById('formTitle').innerText = 'ثبت قطعی برق جدید';
            document.getElementById('formTitle').style.color = '#a7f3d0';
            document.getElementById('submitBtn').innerText = 'افزودن کارت';
            document.getElementById('cancelEditBtn').style.display = 'none';
        }

        async function deleteCard(id) {
            if (!confirm("آیا از حذف این قطعی اطمینان دارید؟")) return;
            allOutages = allOutages.filter(o => o.id !== id);
            await saveToCloud(allOutages);
            fetchOutages();
            resetForm();
        }

        fetchOutages();
    </script>
</body>
      </html>
